name: Deploy React to Oracle Linux

on:
  push:
    branches:
      - master # Your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
        env:
          CI: false

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "build/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: opc
          TARGET: "/var/www/app.thecyberintel.com/html"
          EXCLUDE: "/node_modules/"
          SCRIPT_AFTER: |
            sudo chcon -Rt httpd_sys_content_t /var/www/app.thecyberintel.com/html
